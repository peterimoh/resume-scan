# Copy to .streamlit/secrets.toml and fill in real values.
# In Streamlit Cloud, set these under App settings -> Secrets instead.

[auth]
# Each key is a username; each value is a password (or a sha256$<hex> hash).
admin = "change-me"

# LLM key (used by llm.py for HR/ATS analysis) — any OpenAI-compatible
# chat-completions API works: DeepSeek, Z.ai (GLM), etc.
LLM_API_KEY = "sk-..."
LLM_BASE_URL = "https://api.z.ai/api/paas/v4"
LLM_MODEL = "glm-4.7"
