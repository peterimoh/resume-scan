# Copy to .streamlit/secrets.toml and fill in real values.
# In Streamlit Cloud, set these under App settings -> Secrets instead.

[auth]
# Each key is a username; each value is a password (or a sha256$<hex> hash).
admin = "change-me"

# DeepSeek API key (used by llm.py for HR/ATS analysis)
DEEPSEEK_API_KEY = "sk-..."
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
