<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ResumeForge — Build polished, ATS-ready resumes with live previews and AI-powered HR & ATS analysis."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#100d18" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ResumeForge — AI-powered resume builder</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash of the wrong theme.
      ;(function () {
        try {
          var t = localStorage.getItem("resumeforge-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
